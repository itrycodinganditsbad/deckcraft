[package]
name = "deckcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft egui frontend (PowerPoint-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
deckcraft-geom = { workspace = true }
deckcraft-color = { workspace = true }
deckcraft-model = { workspace = true }
deckcraft-fonts = { workspace = true }
deckcraft-text = { workspace = true }
deckcraft-render = { workspace = true }
deckcraft-anim = { workspace = true }
deckcraft-engine = { workspace = true }
deckcraft-media = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[features]
# Live documents through Craft Cloud: the badge, the account line and shared recents, the banners, other machines'
# selections. Off by default; the desktop app turns it on (never the web build).
live = ["deckcraft-engine/live", "dep:craft-cloud-egui"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-cloud-egui = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The fake agent, for the live window's tests.
craft-cloud-kit = { workspace = true, features = ["fake"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
